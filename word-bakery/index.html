<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adelyn's Rainbow Bakery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--plum:#5c1a6e;--ink:#3d2352;--soft:#6b4a7e;--pink:#ff4f9a;--bg:#fdf0f7;--sky:#e9f2ff;--line:#f3d4ea;--btn:#8a2fa0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:700}
.disp{font-family:'Fredoka','Nunito',system-ui,sans-serif}
.ol{stroke:#5b3a6e;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.ol2{stroke:#5b3a6e;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.ol1{stroke:#5b3a6e;stroke-width:1.2}
button{font-family:inherit}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:22px 20px 30px}

/* header */
.site-top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand h1{margin:0;font-size:clamp(26px,4vw,36px);line-height:1;color:var(--plum)}
.subtitle{font-size:15px;color:var(--soft);margin-top:4px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:7px;padding:8px 14px;background:#fff;border-radius:999px;border:3px solid #eadcf2;font:800 15px 'Nunito',sans-serif;color:var(--ink);min-height:44px}
.toggle{cursor:pointer}
.toggle.on{background:var(--btn);border-color:var(--btn);color:#fff}

/* tabs */
.tabs{display:flex;gap:8px;margin:18px 0 16px;flex-wrap:wrap}
.tab{border:3px solid var(--line);background:#fff;color:var(--plum);font:600 18px 'Fredoka',sans-serif;padding:10px 22px;border-radius:999px;cursor:pointer;min-height:48px}
.tab.active{background:var(--btn);border-color:var(--btn);color:#fff;box-shadow:0 4px 0 #5c1a6e}

.card{background:#fff;border-radius:30px;border:3px solid var(--line);box-shadow:0 8px 0 var(--line);padding:22px 24px}
.title{margin:0;font-size:32px;color:var(--btn);line-height:1.1}
.label{font-size:16px;font-weight:800;color:var(--soft);margin:14px 0 8px}
.small{font-size:14px;color:var(--soft)}
.lead{font-size:18px;font-weight:800;color:var(--soft);line-height:1.35}
.big-lead{color:var(--ink);font-size:19px}
.note-good{font-size:16px;font-weight:800;color:#2e7d52;margin-top:4px}
.grow{flex:1 1 auto;min-height:6px}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;flex:1}
.center.left{align-items:stretch;text-align:left}
.card-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-top:12px}
.row-c{display:flex;gap:10px;justify-content:center}
.row-b{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pinkline{font-size:14px;font-weight:800;color:#c2266a}

/* buttons */
.btn{border:none;cursor:pointer;background:var(--btn);color:#fff;font:600 20px 'Fredoka',sans-serif;padding:13px 26px;border-radius:999px;box-shadow:0 5px 0 #5c1a6e;min-height:52px}
.btn:hover{background:#9b3bb2}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #5c1a6e}
.btn2{white-space:nowrap;flex:none;border:2.5px solid #b99cff;cursor:pointer;background:#fff;color:var(--plum);font:800 15px 'Nunito',sans-serif;padding:8px 14px;border-radius:999px;min-height:44px;display:inline-flex;align-items:center;gap:6px}
.btn2:hover{background:#f4eeff}
.link{border:none;background:none;cursor:pointer;color:var(--btn);font:800 16px 'Nunito',sans-serif;text-decoration:underline;text-underline-offset:3px;padding:10px 0;min-height:44px}

/* bake layout */
.bake-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:22px;align-items:stretch}
@media (max-width:900px){.bake-grid{grid-template-columns:1fr}}
.qcard{display:flex;flex-direction:column;gap:12px;min-height:560px}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chip{padding:6px 14px;border-radius:999px;background:#f1e6ff;color:var(--plum);font-weight:800;font-size:14px}
.progress{display:flex;align-items:center;gap:10px;font-weight:800;font-size:14px;color:var(--soft)}
.bar{width:120px;height:14px;border-radius:999px;background:#f3eaf7;overflow:hidden;border:2px solid #eadcf2}
.bar div{height:100%;border-radius:999px;background:linear-gradient(90deg,#ff6b8b,#ffa94d,#ffe066,#7bd88f,#74c0fc,#b197fc);transition:width .5s}
.qhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.big{font-size:clamp(34px,5vw,46px);font-weight:700;line-height:1.05;color:var(--btn);overflow-wrap:anywhere}
.mid{font-size:clamp(19px,2.4vw,23px);font-weight:500;line-height:1.35;color:var(--ink)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.ans{display:flex;align-items:center;gap:12px;text-align:left;min-height:80px;padding:12px 14px;border-radius:22px;border:3px solid;font:700 16px/1.3 'Nunito',sans-serif;color:var(--ink);cursor:pointer;box-shadow:0 5px 0 rgba(91,58,110,.18);transition:transform .12s}
.ans:hover{transform:translateY(-3px)}
.ans:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(91,58,110,.18)}
.a0{background:#ffe0ee;border-color:#ff9cc8}.a1{background:#ece3ff;border-color:#b99cff}.a2{background:#dcf7ec;border-color:#7fd6b2}.a3{background:#fff4c7;border-color:#ffd24d}
.letter{flex:none;width:38px;height:38px;border-radius:13px;background:#fff;border:2.5px solid #5b3a6e;display:flex;align-items:center;justify-content:center;font:700 17px 'Fredoka',sans-serif}
.slots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:52px;margin-top:6px}
.slotch{width:36px;height:48px;border-bottom:4px solid #ff8cc6;display:flex;align-items:flex-end;justify-content:center;font:700 28px 'Fredoka',sans-serif;color:var(--btn)}
.tiles{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tile{width:46px;height:52px;border-radius:14px;border:3px solid #b99cff;background:#f4eeff;font:700 24px 'Fredoka',sans-serif;color:var(--plum);cursor:pointer;box-shadow:0 4px 0 #d6c6f5}
.tile:hover{transform:translateY(-2px)}
.tile:disabled{opacity:.25;cursor:default;transform:none}
.hintbox{padding:10px 14px;border-radius:18px;background:#fff8e0;border:2px dashed #ffd24d;font-size:15px;line-height:1.35}
.yay{font-size:38px;font-weight:700;color:#2e7d52}
.oops{font-size:34px;font-weight:700;color:var(--plum)}
.es-card{display:flex;flex-direction:column;gap:6px;padding:14px 18px;border-radius:24px;background:#fff8e0;border:3px solid #ffd24d}
.es-label{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#8a5c00}
.es-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.es-word{font-size:30px;font-weight:700;color:var(--plum)}
.es-ex{font-size:17px;line-height:1.35}

/* start screen */
.treat-pick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:10px}
.treatbtn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px 10px;border-radius:22px;border:3px solid #eadcf2;background:#fff;cursor:pointer;font:800 14px 'Nunito',sans-serif;color:var(--ink)}
.treatbtn .mini{width:78%}
.treatbtn.on{border-color:var(--pink);background:#fff0f7;box-shadow:0 4px 0 #ffc2dd}
.pack-pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:520px){.pack-pick{grid-template-columns:1fr}.treat-pick{grid-template-columns:repeat(2,minmax(0,1fr))}}
.packbtn{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:20px;border:3px solid #eadcf2;background:#fff;cursor:pointer;text-align:left;font:800 15px 'Nunito',sans-serif;color:var(--ink);min-height:60px}
.packbtn.on{border-color:var(--btn);background:#f7f0ff;box-shadow:0 4px 0 #d9c6f2}
.packbtn:disabled{cursor:default;background:#f7f4f9;color:#7d6a8a}
.packbtn:disabled .thumbs{filter:grayscale(1);opacity:.35}
.thumbs{display:flex;flex:none}
.thumb{width:32px;height:32px;margin-right:-6px;display:block}
.thumb svg{width:100%;height:100%}
.pk{display:flex;flex-direction:column}.pk small{font-size:12px;font-weight:700;opacity:.85}

/* gift + reveal */
.gifts{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.giftbtn{border:none;background:none;cursor:pointer;padding:4px;border-radius:24px}
.giftbtn:hover svg{transform:translateY(-6px) scale(1.05)}
.giftbtn svg{transition:transform .15s;display:block}
.wiggle{display:block;animation:wig 1.6s ease-in-out infinite}
@keyframes wig{0%,100%{transform:rotate(0)}10%{transform:rotate(-6deg)}20%{transform:rotate(6deg)}30%{transform:rotate(-3deg)}40%{transform:rotate(0)}}
.reveal{width:190px;height:190px;border-radius:40px;background:#fff5fb;border:3px solid #ff9cc8;display:flex;align-items:center;justify-content:center;padding:20px}
.reveal svg{width:100%;height:100%}
.rare-badge{padding:6px 18px;border-radius:999px;background:#ffd54f;color:var(--plum);font:700 20px 'Fredoka',sans-serif;border:3px solid #5b3a6e;animation:tw 1s ease-in-out infinite alternate}
.new-badge{padding:5px 14px;border-radius:999px;background:#dcf7ec;color:#1f6b45;font:800 15px 'Nunito',sans-serif}
.namein{width:100%;font:700 22px 'Fredoka',sans-serif;color:var(--plum);padding:12px 16px;border-radius:18px;border:3px solid #b99cff;background:#fbf8ff}

/* stage */
.stage-wrap{display:flex}
.stage{position:relative;flex:1;border-radius:30px;background:var(--sky);border:3px solid #fff;box-shadow:0 8px 0 #d9e5f7;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:66px 18px 40px;min-height:560px}
.sky{position:absolute;inset:0;width:100%;height:100%}
.sky path{fill:none;stroke-width:26px}
.stage .treat-box{width:min(100%,520px)}
.stage-top{position:absolute;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.frost-row{display:flex;align-items:center;gap:7px;padding:6px 10px 6px 14px;background:rgba(255,255,255,.9);border-radius:999px;font-size:14px;font-weight:800;color:var(--plum)}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid #fff;cursor:pointer;box-shadow:0 2px 6px rgba(91,58,110,.25)}
.sw.on{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--btn)}
.pack-badge{padding:8px 14px;background:rgba(255,255,255,.9);border-radius:999px;font-weight:800;font-size:14px;color:var(--plum);align-self:center}
.stage-hint{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-weight:800;font-size:14px;color:var(--soft)}
.treat-box{position:relative;aspect-ratio:1/1;width:100%}
.treat-svg{position:absolute;inset:0;width:100%;height:100%}
.top,.mtop{position:absolute}
.top svg,.mtop svg{width:100%;height:100%;display:block;pointer-events:none;filter:drop-shadow(0 3px 2px rgba(91,58,110,.22))}
.top{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.top.dragging{cursor:grabbing;z-index:5;filter:drop-shadow(0 8px 6px rgba(91,58,110,.3))}
.pop{animation:pop .75s cubic-bezier(.34,1.56,.64,1) both}
@keyframes pop{0%{transform:translateY(-70px) scale(.2);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}
.done-spark{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;animation:tw 1.1s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.35}to{opacity:1}}

/* shelf */
.shelf-strip{margin-top:26px}
.shelf-strip h2{margin:0 0 8px;font-size:22px;font-weight:600;color:var(--plum)}
.shelf{display:flex;gap:14px;padding:12px 16px;min-height:150px;border-radius:26px;background:#fff;border:3px solid var(--line);border-bottom:10px solid #f7c6de;align-items:flex-start;overflow-x:auto}
.big-shelf{flex-wrap:wrap}
.shelf-item{display:flex;flex-direction:column;align-items:center;gap:4px;width:130px;flex:none}
.shelf-item .mini{width:122px;border-radius:20px;background:var(--sky);padding:4px}
.shelf-name{font-size:12px;font-weight:800;text-align:center;line-height:1.2}
.shelf-empty{flex:1;align-self:center;text-align:center;font-weight:800;font-size:16px;color:#8a7896}
.mini{position:relative}

/* collection */
.coll-row{margin-bottom:10px}
.coll-name{font:600 17px 'Fredoka',sans-serif;color:var(--plum);margin-bottom:6px}
.coll{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.coll-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:18px;border:2.5px solid #eadcf2;background:#faf7fc;font-size:11px;font-weight:800;text-align:center;color:#8a7896}
.coll-item svg{width:52px;height:52px;filter:grayscale(1) brightness(1.5);opacity:.3}
.coll-item.got{background:#fff5fb;border-color:#ff9cc8;color:var(--ink)}
.coll-item.got svg{filter:none;opacity:1}
.stats-row{display:flex;gap:18px;flex-wrap:wrap;margin:14px 0;font-size:16px;color:var(--soft)}

/* match mode (kept from the original game, restyled) */
.ticket-label{display:inline-block;padding:6px 14px;border-radius:999px;background:#f1e6ff;color:var(--plum);font-weight:800;font-size:14px;margin-bottom:12px}
.customer-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.customer-avatar{flex:none}
.speech-bubble{background:#fff8e0;border:2px solid #ffd24d;border-radius:18px;padding:10px 14px;font-size:16px;line-height:1.35}
.match-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.match-col-label{font:600 17px 'Fredoka',sans-serif;color:var(--plum);margin-bottom:8px}
.match-item{padding:12px 14px;margin-bottom:8px;border-radius:16px;border:3px solid #eadcf2;background:#fff;cursor:pointer;font-size:15px;line-height:1.3;min-height:48px}
.match-item:hover{background:#faf5ff}
.match-item.selected{border-color:var(--btn);background:#f4eeff}
.match-item.matched{border-color:#2e9e62;background:#d3f8e0;cursor:default;opacity:.8}
.match-item.wrong-flash{border-color:#d9475f;background:#ffe3e6}
.feedback{min-height:26px;margin-top:10px;font-size:17px;font-weight:800}
.feedback.good{color:#2e7d52}.feedback.bad{color:#b3243c}
.next-btn{display:none;margin-top:12px;border:none;cursor:pointer;background:var(--btn);color:#fff;font:600 18px 'Fredoka',sans-serif;padding:12px 24px;border-radius:999px;box-shadow:0 5px 0 #5c1a6e;min-height:48px}
.next-btn.show{display:inline-block}
.combo-tag{display:inline-block;margin-left:8px;padding:3px 10px;border-radius:999px;background:#ffd54f;color:var(--plum);font-size:13px}
.confetti-piece{position:fixed;top:-10px;width:10px;height:14px;border-radius:3px;z-index:50;pointer-events:none}

/* parent settings (kept) */
.parent-settings{margin-top:22px;border-top:2px dashed #eadcf2;padding-top:14px}
.parent-settings summary{cursor:pointer;font:600 17px 'Fredoka',sans-serif;color:var(--soft);min-height:44px;display:flex;align-items:center}
.settings-body{font-size:15px;font-weight:700;line-height:1.5}
.settings-body input{font:700 15px 'Nunito',sans-serif;padding:8px 10px;border-radius:10px;border:2px solid #d9c6f2;margin:4px 0}
.settings-save-btn{border:none;background:var(--btn);color:#fff;font:700 14px 'Nunito',sans-serif;padding:9px 14px;border-radius:999px;cursor:pointer;margin:4px 0 4px 6px;min-height:40px}
.settings-note{font-size:13px;color:var(--soft);font-weight:700}
.box-section-title{font:600 16px 'Fredoka',sans-serif;color:var(--plum);margin:14px 0 6px}
.report-row{padding:6px 0;border-bottom:1px solid #f1e6f5;font-size:14px}
.report-correct{color:#1f6b45}.report-wrong{color:#9e1f36}

footer{margin-top:26px;text-align:center;font-size:13px;color:#8a7896}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>
</head>
<body>
<div class="wrap">
  <header class="site-top">
    <div class="brand">
      <svg viewBox="0 0 100 100" width="56" height="56" aria-hidden="true">
        <path d="M22 58 L30 94 L70 94 L78 58 Z" fill="#b99cff" class="ol"/>
        <path d="M36 60 L40 92 M50 60 L50 92 M64 60 L60 92" fill="none" class="ol2"/>
        <path d="M16 60 C8 48 22 38 30 42 C28 26 48 22 52 32 C58 20 78 26 72 40 C86 38 92 54 84 60 Z" fill="#ffb8dc" class="ol"/>
        <circle cx="52" cy="18" r="9" fill="#ff4d6d" class="ol"/>
      </svg>
      <div>
        <h1 class="disp">Adelyn's Rainbow Bakery</h1>
        <div class="subtitle">Answer word questions, open gifts, decorate your treats</div>
      </div>
    </div>
    <div class="pills">
      <div class="pill" style="border-color:#ffd24d">
        <svg viewBox="0 0 100 100" width="22" height="22" aria-hidden="true"><polygon points="50,6 61,38 95,38 67,58 78,92 50,72 22,92 33,58 5,38 39,38" fill="#ffd84d" class="ol"/></svg>
        <span id="streakStat">0 in a row</span>
      </div>
      <div class="pill" style="border-color:#ff9cc8">
        <svg viewBox="0 0 100 100" width="22" height="22" aria-hidden="true"><path d="M50 88 C20 68 6 50 16 32 C26 14 46 18 50 34 C54 18 74 14 84 32 C94 50 80 68 50 88 Z" fill="#ff5fa2" class="ol"/></svg>
        <span id="rightStat">0 words right</span>
      </div>
      <div class="pill" style="border-color:#b99cff"><span id="dayStat">0 day streak</span></div>
      <button class="pill toggle" id="readToggle"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 9 H8 L13 5 V19 L8 15 H4 Z" fill="currentColor"/><path d="M16 9 Q18 12 16 15 M18.5 6.5 Q22 12 18.5 17.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Read to me: off</span></button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-mode="quiz">Bake!</button>
    <button class="tab" data-mode="match">Match Orders</button>
    <button class="tab" data-mode="shop">My Bakery</button>
  </nav>

  <div id="gameCard"></div>

  <footer>Adelyn's Rainbow Bakery &middot; Vocabulary, Grade 4 &middot; progress saves right here on this device</footer>
</div>

<script>

// ---------- Word bank ----------
// Pulled straight from Adelyn's real Vocabulary & Reading curriculum
// (root words + frequency words, all 36 weeks).
//
// HOW TO ADVANCE HER PACING:
// state.currentWeek (default 1) is the highest week she's been taught —
// it should always match her current_week pointer in the ELA Pastry
// Kitchen app. It's editable right in the game: My Bakery tab -> Parent
// Settings. Words from any week ABOVE currentWeek are never shown, in
// quiz, match, or the treat shelf — she can't stumble onto vocab she
// hasn't been taught yet. The current week and the one before it count
// as "active" (shown most often); everything taught before that becomes
// review material, cycled back in less often, with anything she's missed
// prioritized until she gets it right twice in a row.

// ---------- Storage (real localStorage — works fully offline, per device) ----------
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state = Object.assign(state, JSON.parse(raw));
  } catch (e) {
    // no saved progress yet, or storage unavailable — use defaults
  }
  if (!state.mastery) state.mastery = {};
  if (!Array.isArray(state.attemptLog)) state.attemptLog = [];
  if (!state.shopOwned) state.shopOwned = {};
  if (!state.decorPositions) state.decorPositions = {};
  if (typeof state.currentWeek !== "number" || state.currentWeek < 1) state.currentWeek = 1;
  if (typeof state.webAppUrl !== "string" || !state.webAppUrl) state.webAppUrl = DEFAULT_WEB_APP_URL;
  if (typeof state.roundCounter !== "number") state.roundCounter = 0;
  if (typeof state.lifetimePoints !== "number") state.lifetimePoints = 0;
  if (typeof state.sprinkles !== "number") state.sprinkles = 0;
  if (typeof state.streak !== "number") state.streak = 0;
  if (typeof state.dayStreak !== "number") state.dayStreak = 0;
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    console.error("Could not save progress", e);

}

// ---------- Live sync with her ELA Pastry Kitchen Sheet (optional) ----------
// If a Web App URL is set (Parent Settings), pull her real current_week
// straight from the same Google Sheet/Apps Script backend that app uses,
// so this game never needs a manual update again. This is the ONLY network
// call this game ever makes — everything else stays fully offline, and if
// this fails (no internet, bad URL, etc.) it just keeps using whatever
// week was last known, silently. Never blocks or delays gameplay: it runs
// in the background and only takes effect on the next round/tab render.
async function syncCurrentWeek() {
  if (!state.webAppUrl) return;
  try {
    const sep = state.webAppUrl.includes("?") ? "&" : "?";
    const res = await fetch(state.webAppUrl + sep + "action=bootstrap&student=adelyn");
    const data = await res.json();
    const raw = data && data.ok && data.settings ? data.settings.adelyn_current_week : null;
    const week = parseInt(raw, 10);
    if (week >= 1 && week <= 36) state.currentWeek = week;
    state.lastSyncOk = true;
  } catch (e) {
    state.lastSyncOk = false;
  }
  state.lastSyncAt = new Date().toISOString();
  saveState();
  if (currentMode === "shop") renderShop();
}

function getMastery(id) {
  if (!state.mastery[id]) {
    state.mastery[id] = { correct: 0, wrong: 0, needsReview: false, reviewRemaining: 0, lastSeen: 0 };
  }
  return state.mastery[id];
}

// Parent visibility: keep a capped local log of actual answers (works
// offline, same device) and push each one to the same Google
// Sheet/Apps Script backend syncCurrentWeek() already talks to, if a Web
// App URL is set — so Kristina can also check from her own phone/computer.
// Best-effort only: never blocks gameplay if it fails or isn't configured.
const MAX_ATTEMPT_LOG = 50;

function logAttempt(detail) {
  const entry = {
    timestamp: new Date().toISOString(),
    subject: detail.subject || "vocabulary",
    word: detail.word,
    question: detail.question || "",
    givenAnswer: detail.givenAnswer,
    correctAnswer: detail.correctAnswer,
    correct: detail.wasCorrect,
  };
  if (!Array.isArray(state.attemptLog)) state.attemptLog = [];
  state.attemptLog.push(entry);
  while (state.attemptLog.length > MAX_ATTEMPT_LOG) state.attemptLog.shift();

  if (!state.webAppUrl) return;
  fetch(state.webAppUrl, {
    method: "POST",
    body: JSON.stringify({
      action: "logAnswer",
      student: "adelyn",
      game: "Word Bakery",
      subject: entry.subject,
      word: entry.word,
      question: entry.question,
      given_answer: entry.givenAnswer,
      correct_answer: entry.correctAnswer,
      correct: entry.correct,
    }),
  }).catch(() => {});
}

function recordAnswer(id, isCorrect, detail) {
  const m = getMastery(id);
  m.lastSeen = state.roundCounter;
  if (detail) logAttempt(detail);
  if (isCorrect) {
    m.correct += 1;
    if (m.needsReview) {
      m.reviewRemaining -= 1;
      if (m.reviewRemaining <= 0) m.needsReview = false;
    }
  } else {
    m.wrong += 1;
    m.needsReview = true;
    m.reviewRemaining = 2;
  }
}

function treatFor(wordId) {
  let sum = 0;
  for (let i = 0; i < wordId.length; i++) sum += wordId.charCodeAt(i);
  return TREAT_EMOJI[sum % TREAT_EMOJI.length];
}

// Flies a "+N ✨" label from wherever she just answered to the sprinkles
// counter in the rank bar — purely visual, the real count already updated.
function flyPoints(originEl, amount) {
  const target = document.getElementById("sprinklesDisplay");
  if (!originEl || !target) return;
  const startRect = originEl.getBoundingClientRect();
  const endRect = target.getBoundingClientRect();
  const el = document.createElement("div");
  el.className = "fly-point";
  el.textContent = "+" + amount + " ✨";
  el.style.left = (startRect.left + startRect.width / 2) + "px";
  el.style.top = startRect.top + "px";
  document.body.appendChild(el);
  const dx = (endRect.left + endRect.width / 2) - (startRect.left + startRect.width / 2);
  const dy = endRect.top - startRect.top;
  const anim = el.animate(
    [
      { transform: "translate(0,0) scale(1)", opacity: 1 },
      { transform: "translate(" + dx + "px," + dy + "px) scale(0.55)", opacity: 0.15 }
    ],
    { duration: 650, easing: "cubic-bezier(.3,.6,.4,1)" }
  );
  anim.onfinish = () => el.remove();
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// "Taught" = week <= her current pointer — a hard cutoff. Words above it
// never enter any pool, so she can never see vocab she hasn't reached yet.
function isTaught(item) { return item.week <= state.currentWeek; }
function isActive(item) { return item.week <= state.currentWeek && item.week > state.currentWeek - ACTIVE_WINDOW; }

// ---------- Round pool builder ----------
function buildRoundPool(missedSlots, generalSlots) {
  state.roundCounter++;
  const active = shuffle(WORDS.filter(isActive));
  const older = WORDS.filter(w => isTaught(w) && !isActive(w));

  const missed = older.filter(w => getMastery(w.id).needsReview)
    .sort((a, b) => getMastery(a.id).lastSeen - getMastery(b.id).lastSeen)
    .slice(0, missedSlots);

  const missedIds = new Set(missed.map(w => w.id));
  const general = older.filter(w => !missedIds.has(w.id))
    .sort((a, b) => getMastery(a.id).lastSeen - getMastery(b.id).lastSeen)
    .slice(0, generalSlots);

  const pool = shuffle(active.concat(missed, general));
  pool.forEach(w => { getMastery(w.id).lastSeen = state.roundCounter; });
  return pool;
}

// ---------- Distractor helpers ----------
function pickDistractorDefinitions(item, count) {
  const others = WORDS.filter(w => w.id !== item.id && w.definition !== item.definition);
  return shuffle(others).slice(0, count).map(w => w.definition);
}

function pickDistractorWords(item, count) {
  const others = WORDS.filter(w => w.id !== item.id && w.word.toLowerCase() !== item.word.toLowerCase());
  return shuffle(others).slice(0, count).map(w => w.word);
}

function blankOutWord(example, word) {
  const tokens = example.match(/[A-Za-z']+/g) || [];
  const wLower = word.toLowerCase();
  let best = null;
  let bestScore = 0;
  for (const t of tokens) {
    const tLower = t.toLowerCase();
    let score = 0;
    const max = Math.min(tLower.length, wLower.length);
    while (score < max && tLower[score] === wLower[score]) score++;
    if (tLower === wLower) score += 100;
    if (score > bestScore && score >= Math.min(4, wLower.length)) {
      bestScore = score;
      best = t;
    }
  }
  const target = best || word;
  const re = new RegExp("\\b" + target.replace(/[.*+?^${}()|[\]\\\\]/g, "\\$&") + "\\b");
  return example.replace(re, "_____");
}

function rootNoteLine(item) {

function checkDailyVisit() {
  const today = todayStr();
  if (state.lastVisitDate === today) return false;

  const y = new Date();
  y.setDate(y.getDate() - 1);
  const yesterday = y.getFullYear() + "-" + (y.getMonth() + 1) + "-" + y.getDate();

  state.dayStreak = state.lastVisitDate === yesterday ? state.dayStreak + 1 : 1;
  state.lastVisitDate = today;
  state.sprinkles += 15;
  saveState();
  return true;
}

function selectMatchWord(el, item) {
  if (el.classList.contains("matched")) return;
  document.querySelectorAll("#wordsCol .match-item").forEach(e => e.classList.remove("selected"));
  el.classList.add("selected");
  matchSelectedWord = { el, item };
  tryMatch();
}

function selectMatchDef(el, item) {
  if (el.classList.contains("matched")) return;
  document.querySelectorAll("#defsCol .match-item").forEach(e => e.classList.remove("selected"));
  el.classList.add("selected");
  matchSelectedDef = { el, item };
  tryMatch();
}

function tryMatch() {
  if (!matchSelectedWord || !matchSelectedDef) return;
  const fb = document.getElementById("matchFeedback");
  const wordItem = matchSelectedWord.item;
  const defItem = matchSelectedDef.item;
  const isMatch = wordItem.word === defItem.word;
  recordAnswer(wordItem.id, isMatch, {
    subject: "vocabulary",
    word: wordItem.word,
    question: "Match the word to its definition",
    givenAnswer: defItem.definition,
    correctAnswer: wordItem.definition,
    wasCorrect: isMatch,
  });

  if (isMatch) {
    matchSelectedWord.el.classList.remove("selected");
    matchSelectedDef.el.classList.remove("selected");
    matchSelectedWord.el.classList.add("matched");
    matchSelectedDef.el.classList.add("matched");
    const gain = 8 + Math.min(state.streak, 10);
    state.lifetimePoints += gain;
    state.sprinkles += gain;
    state.streak += 1;
    matchedCount++;
    fb.className = "feedback good";
    fb.innerHTML = "\u2713 Match! (" + matchedCount + " of " + matchPool.length + " orders filled)" + comboTagHtml(state.streak);
    flyPoints(matchSelectedDef.el, gain);
    if (matchedCount === matchPool.length) {
      fb.innerHTML += " \u2014 Whole board cleared!";
      celebrate();
    } else if (state.streak > 0 && state.streak % 4 === 0) {
      celebrate(state.streak % 8 !== 0);
    }
  } else {
    matchSelectedWord.el.classList.add("wrong-flash");
    matchSelectedDef.el.classList.add("wrong-flash");
    state.streak = 0;
    fb.className = "feedback bad";
    fb.textContent = "\u2717 Not a match. Try again.";
    const w = matchSelectedWord, d = matchSelectedDef;
    setTimeout(() => {
      w.el.classList.remove("selected", "wrong-flash");
      d.el.classList.remove("selected", "wrong-flash");
    }, 500);
  }
  matchSelectedWord = null;
  matchSelectedDef = null;
  renderRankBar();
  saveState();
}

// mini=true gives a smaller, quieter burst for the more frequent combo
// milestones, so the full 24-piece version still feels special.
function celebrate(mini) {
  const colors = ["#ff8cc6", "#ffd84d", "#7bd88f", "#74c0fc", "#b99cff"];
  const count = mini ? 10 : 24;
  for (let i = 0; i < count; i++) {

    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.transform = "rotate(" + Math.random() * 360 + "deg)";
    document.body.appendChild(piece);
    const duration = 900 + Math.random() * 700;
    piece.animate(
      [
        { transform: piece.style.transform, top: "-10px", opacity: 1 },
        { transform: piece.style.transform, top: "100vh", opacity: 0.9 }
      ],
      { duration, easing: "ease-in" }
    );
    setTimeout(() => piece.remove(), duration + 50);
  }
  playTone(mini);
}

function playTone(soft) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const notes = soft ? [659.25, 783.99] : [523.25, 659.25, 783.99];
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.value = freq;
      osc.type = "sine";
      gain.gain.setValueAtTime(0.15, ctx.currentTime + i * 0.12);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.12 + 0.35);
      osc.connect(gain).connect(ctx.destination);
      osc.start(ctx.currentTime + i * 0.12);
      osc.stop(ctx.currentTime + i * 0.12 + 0.35);
    });
  } catch (e) {
    // Web Audio unavailable — silently skip, nothing else depends on it.
  }
}

// ---------- speech ----------
function speak(text, lang) {
  try {
    const ss = window.speechSynthesis; if (!ss || !text) return;
    ss.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang; u.rate = 0.88;
    const vs = ss.getVoices() || [];
    const v = vs.find(x => x.lang && x.lang.toLowerCase() === lang.toLowerCase()) ||
      vs.find(x => x.lang && x.lang.slice(0, 2) === lang.slice(0, 2));
    if (v) u.voice = v;
    ss.speak(u);
  } catch (e) { }
}

    if (!vs.some(v => v.lang === "es-MX")) lang = vs.some(v => v.lang === "es-US") ? "es-US" : "es-ES";

function swapWord(sentence, word, repl) {
  const blanked = blankOutWord(sentence, word);
  const i = blanked.indexOf("_____");
  if (i < 0) return null;
  const capital = i === 0 || /[.!?]\s*$/.test(blanked.slice(0, i));
  const r = capital ? repl[0].toUpperCase() + repl.slice(1) : repl;
  return blanked.slice(0, i) + r + blanked.slice(i + 5);
}
function famParts(label) {
  const parts = String(label).split(" — ");
  const key = parts[0].trim();
  const meaning = (parts[1] || "").replace(/\s*\(.*\)\s*$/, "").trim();
  const letters = key.split("/")[0].replace(/[^A-Za-z]/g, "").toLowerCase();
  return { key, meaning, letters };
}

function makeQuestion(item, lastType) {
  const taught = WORDS.filter(isTaught);
  const pool = taught.length >= 6 ? taught : WORDS.filter(w => w.week <= Math.max(state.currentWeek, 2));
  const others = shuffle(pool.filter(w => w.id !== item.id));
  const e = ex(item);
  const four = (list, field) => {
    const seen = new Set([String(item[field]).toLowerCase()]);
    const picked = [];
    for (const w of list) {
      const v = String(field === "syn" ? ex(w).syn : w[field]);
      if (!v || seen.has(v.toLowerCase())) continue;
      seen.add(v.toLowerCase()); picked.push(v);
      if (picked.length === 3) break;
    }
    if (picked.length < 3) return null;
    const right = field === "syn" ? e.syn : item[field];
    return shuffle([right].concat(picked)).map(t => ({ text: t, ok: t === right }));
  };
  const gens = {
    def() {
      const opts = four(others, "definition"); if (!opts) return null;
      return { lead: "What does this word mean?", big: item.word, opts, speak: item.word,
        hint: item.rootNote ? "Root clue: " + item.rootNote : "Clue sentence: " + item.example,
        answer: item.word + " means " + item.definition + ".", correctText: item.definition };
    },
    blank() {
      const opts = four(others, "word"); if (!opts) return null;
      const mid = blankOutWord(item.example, item.word);
      return { lead: "Which word fills the blank?", mid, opts, speak: mid.replace("_____", "blank"),
        hint: "The missing word means: " + item.definition + ".", answer: "The missing word is " + item.word + ".", correctText: item.word };
    },
    syn() {
      if (!e.syn) return null;
      const opts = four(others.filter(w => ex(w).syn && ex(w).pos !== e.pos && ex(w).syn.toLowerCase() !== item.word.toLowerCase()), "syn");
      if (!opts) return null;
      return { lead: "Which word means almost the same thing?", big: item.word, opts, speak: item.word,
        hint: item.word + " means " + item.definition + ".", answer: item.word + " means about the same as “" + e.syn + ".”", correctText: e.syn };
    },
    usage() {
      let fits = Math.random() < 0.5, sentence = item.example;
      if (!fits) {
        const nounVerb = e.pos === "n" || e.pos === "v";
        const slot = others.find(w => { const p = ex(w).pos; return nounVerb ? (p === "adv" || p === "conj") : p === "n"; });
        const swapped = slot ? swapWord(slot.example, slot.word, item.word) : null;
        if (swapped) sentence = swapped; else fits = true;
      }
      return { lead: "Does “" + item.word + "” make sense in this sentence?", mid: sentence, speak: sentence,
        opts: [{ text: "Yes, it makes sense", ok: fits }, { text: "No, it doesn't fit", ok: !fits }],
        hint: "Remember: " + item.word + " means " + item.definition + ".",
        answer: fits ? "Yes! It fits, because " + item.word + " means " + item.definition + "." : "That sentence needs a different word. " + item.word + " means " + item.definition + ".",
        correctText: fits ? "Yes, it makes sense" : "No, it doesn't fit" };
    },
    unscramble() {
      const w = item.word.toLowerCase();
      if (!/^[a-z]+$/.test(w) || w.length < 4) return null;
      let letters = w.split(""), tries = 0;
      do { letters = shuffle(letters); tries++; } while (letters.join("") === w && tries < 12);
      return { lead: "Unscramble the word that means:", mid: item.definition, tiles: letters, speak: item.definition,
        hint: "It starts with “" + w[0].toUpperCase() + "” and has " + w.length + " letters.",
        answer: "It's spelled " + w.toUpperCase().split("").join("-") + ".", correctText: item.word };
    },
    build() {
      if (item.type !== "root" || !item.rootNote) return null;
      const same = others.filter(w => w.rootFamily && w.rootFamily === item.rootFamily);
      const rest = others.filter(w => w.rootFamily !== item.rootFamily);
      const opts = four(same.concat(rest), "word"); if (!opts) return null;
      return { lead: "Put the parts together. Which word do they make?", mid: item.rootNote, opts, speak: item.rootNote,
        hint: "The word means: " + item.definition + ".", answer: item.rootNote + " makes " + item.word + ".", correctText: item.word };
    },
    family() {
      if (item.type !== "root" || !item.rootFamily) return null;
      const f = famParts(item.rootFamily);
      const opts = four(others.filter(w => w.rootFamily !== item.rootFamily), "word"); if (!opts) return null;
      return { lead: "Which word belongs to this root family?", big: f.key + " = " + f.meaning, opts,
        speak: "Which word belongs to the " + f.letters + " family? It means " + f.meaning + ".",
        hint: "Look for “" + f.letters + "” hiding inside the word.", answer: item.word + " is in the " + f.key + " family (" + f.meaning + ").", correctText: item.word };
    }
  };
  let order = shuffle(Object.keys(gens));
  order = order.filter(t => t !== lastType).concat(order.filter(t => t === lastType));
  for (const t of order) {
    const q = gens[t]();
    if (q) return Object.assign({ type: t, item, big: "", mid: "", opts: [], tiles: null }, q);
  }
  return null;
}

// ---------- bake session (not saved; the bakery itself is) ----------
const bake = { screen: "start", phase: "ask", q: null, pool: [], idx: 0, built: [], hint: false, gifts: [], reward: null, answer: "", yay: "", lastType: "", given: "" };

function nextQuestion() {
  let tries = 0;
  while (tries++ < 400) {
    if (bake.idx >= bake.pool.length) { bake.pool = buildRoundPool(3, 2); bake.idx = 0; saveState(); }
    if (!bake.pool.length) bake.pool = shuffle(WORDS.filter(isTaught));
    const item = bake.pool[bake.idx++];
    const q = item ? makeQuestion(item, bake.lastType) : null;
    if (q) {
      bake.q = q; bake.lastType = q.type; bake.phase = "ask"; bake.built = []; bake.hint = false; bake.screen = "bake";
      renderBakeCard();
      if (state.autoRead) setTimeout(() => sayEn(q.speak), 350);
      return;
    }
  }
}

function giveAnswer(ok, given) {
  const q = bake.q;
  recordAnswer(q.item.id, ok, {
    subject: "vocabulary", word: q.item.word, question: TYPE_LABEL[q.type],
    givenAnswer: given, correctAnswer: q.correctText, wasCorrect: ok
  });
  bake.answer = q.answer.charAt(0).toUpperCase() + q.answer.slice(1); bake.given = given;
  if (ok) {
    state.streak += 1; state.wordsRight += 1; state.lifetimePoints += 10;
    state.bestStreak = Math.max(state.bestStreak, state.streak);
    bake.yay = pick(YAY); bake.phase = "right";
    const pack = PACKS.find(p => p.id === state.bakery.pack) || PACKS[0];
    const fresh = pack.kinds.filter(k => !state.bakery.collected[k]);
    const notOnTreat = pack.kinds.filter(k => !state.bakery.placed.some(p => p.kind === k));
    const base = shuffle(fresh.length ? fresh : (notOnTreat.length ? notOnTreat : pack.kinds));
    const filler = shuffle(pack.kinds);
    let rareUsed = false;
    bake.gifts = [0, 1, 2].map(i => {
      if (!rareUsed && Math.random() < RARE_CHANCE) { rareUsed = true; return pick(RARES); }
      return base[i] || filler[i % filler.length];
    });
    if (state.streak > 0 && state.streak % 5 === 0) celebrate(true); else playTone(true);
  } else {
    state.streak = 0; bake.phase = "wrong";
    bake.pool.splice(Math.min(bake.pool.length, bake.idx + 3), 0, q.item);
  }
  saveState(); renderRankBar(); renderBakeCard();
}

function placeReward() {
  const b = state.bakery;
  const spots = SPOTS[b.treat];
  const n = b.placed.length;
  const sp = spots[n % spots.length];
  const jitter = n >= spots.length ? 22 : 0;
  b.placed.forEach(p => { p.fresh = false; });
  b.placed.push({ uid: b.uid++, kind: bake.reward, x: sp[0] + (Math.random() - 0.5) * jitter, y: sp[1] + (Math.random() - 0.5) * jitter, fresh: true });
  b.collected[bake.reward] = true;
  saveState();
  renderStage();
  if (b.placed.length >= GOAL) {
    const pk = PACKS.find(p => p.id === b.pack);
    bake.name = pk.name.split(" ")[0] + " Dream " + TREATS.find(t => t.id === b.treat).name;
    bake.screen = "done"; renderBakeCard(); renderStage(); celebrate();
  } else {
    nextQuestion();
  }
}

function saveToShelf(name) {
  const b = state.bakery;
  const f = FROST[b.frost];
  b.shelf.unshift({ treat: b.treat, base: f.base, drip: f.drip, name: (name || "My Treat").slice(0, 28), date: todayStr(),
    placed: b.placed.map(p => ({ kind: p.kind, x: Math.round(p.x), y: Math.round(p.y) })) });
  bake.unlockMsg = "";
  if (b.unlocked < PACKS.length) { bake.unlockMsg = PACKS[b.unlocked].name; b.pack = PACKS[b.unlocked].id; b.unlocked += 1; }
  const ti = TREATS.findIndex(t => t.id === b.treat);
  b.treat = TREATS[(ti + 1) % TREATS.length].id;
  b.frost = (b.frost + 1) % FROST.length;
  b.placed = []; b.inProgress = false;
  saveState();
  bake.screen = "start";
  renderBakeCard(); renderStage(); renderShelfStrip();
  celebrate();
}

function renderStage() {

  box.innerHTML = treatSvg(b.treat, f.base, f.drip) + b.placed.map(p => topHtml(p, "top" + (p.fresh ? " pop" : ""))).join("") +

  box.querySelectorAll(".top").forEach(el => attachToppingDrag(el, box));
}

function attachToppingDrag(el, box) {
  el.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    const uid = +el.dataset.uid;
    const p = state.bakery.placed.find(x => x.uid === uid); if (!p) return;
    const r = box.getBoundingClientRect();
    const k = r.width / 520;
    const size = TOPS[p.kind].size;
    el.setPointerCapture(e.pointerId);
    el.classList.remove("pop"); el.classList.add("dragging");
    const move = (ev) => {
      p.x = Math.max(10, Math.min(510, (ev.clientX - r.left) / k));
      p.y = Math.max(10, Math.min(510, (ev.clientY - r.top) / k));
      el.style.left = ((p.x - size / 2) / 5.2).toFixed(2) + "%";
      el.style.top = ((p.y - size / 2) / 5.2).toFixed(2) + "%";
    };
    const up = () => {
      el.classList.remove("dragging"); p.fresh = false;
      el.removeEventListener("pointermove", move); el.removeEventListener("pointerup", up); el.removeEventListener("pointercancel", up);
      saveState();
    };
    el.addEventListener("pointermove", move); el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up);
  });
}

function renderShelfStrip() {
  const el = document.getElementById("shelfStrip"); if (!el) return;

    return;
  }
  if (s === "gift") {
    card.innerHTML = `<div class="center">
      <h2 class="disp title">Pick a gift box!</h2>
      <p class="small">Each one hides a different topping. Some are rare!</p>

    });
    return;

    const isNew = !b.collected[bake.reward];
    card.innerHTML = `<div class="center">
      ${t.rare ? '<div class="rare-badge">RARE TOPPING!</div>' : (isNew ? '<div class="new-badge">New for your collection!</div>' : "")}

      <div class="row-c"><button class="btn2" id="undoBtn">Undo</button><button class="btn2" id="clearBtn">Start over</button></div>`

  } else if (bake.phase === "right") {

  } else {
    body = `
      <div class="disp oops">So close!</div>
      <div class="lead big-lead">${esc(bake.answer)}</div>
      <div class="small">This word will come back in a little bit so you can try again.</div>
      <div class="grow"></div>
      <div class="card-foot"><button class="btn2" id="enBtn">${SPEAKER_SVG}<span>Hear it</span></button><button class="btn" id="nextBtn2">Next word</button></div>`;
  }
  card.innerHTML = `<div class="qtop"><span class="chip">${esc(chip)}</span>${progressHtml()}</div>${body}`;
  const on = (id, fn) => { const x = card.querySelector("#" + id); if (x) x.onclick = fn; };

  card.querySelectorAll(".ans").forEach(x => x.onclick = () => {
    if (bake.phase !== "ask") return;

  card.querySelectorAll(".tile").forEach(x => x.onclick = () => {

      const guess = bake.built.map(j => q.tiles[j]).join("");
      setTimeout(() => giveAnswer(guess === item.word.toLowerCase(), guess), 350);
    }
  });
}

  const detailsEl = document.getElementById("parentSettingsDetails");
  detailsEl.addEventListener("toggle", () => { parentSettingsOpen = detailsEl.open; });
  document.getElementById("saveWeekBtn").addEventListener("click", () => {
    const input = document.getElementById("currentWeekInput");
    const week = Math.max(1, Math.min(36, parseInt(input.value, 10) || 1));
    input.value = week; state.currentWeek = week; saveState();
    document.getElementById("weekSavedNote").textContent = "✓ Saved — now on week " + week + ".";
  });
  document.getElementById("saveUrlBtn").addEventListener("click", async () => {
    state.webAppUrl = document.getElementById("webAppUrlInput").value.trim();
    saveState();
    document.getElementById("syncStatusNote").textContent = "Syncing…";
    await syncCurrentWeek();
    renderShop();
  });
}

// ---------- header stats (replaces the old sprinkles/rank bar) ----------
function renderRankBar() {
  const set = (id, t) => { const el = document.getElementById(id); if (el) el.textContent = t; };
  set("streakStat", state.streak + " in a row");
  set("rightStat", state.wordsRight + " words right");
  set("dayStat", state.dayStreak + " day streak");
  const rt = document.getElementById("readToggle");
  if (rt) { rt.classList.toggle("on", state.autoRead); rt.querySelector("span").textContent = state.autoRead ? "Read to me: on" : "Read to me: off"; }
}
function comboTagHtml(streak) {
  if (streak <= 1) return "";
  return '<span class="combo-tag">Combo x' + streak + "</span>";
}

// ---------- Tabs + init ----------
document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    currentMode = tab.dataset.mode;
    try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) { }
    if (currentMode === "quiz") renderBakeMode();
    else if (currentMode === "match") { document.getElementById("gameCard").className = "card"; startMatch(); }
    else renderShop();
  });
});
document.getElementById("readToggle").addEventListener("click", () => {
  state.autoRead = !state.autoRead; saveState(); renderRankBar();
  if (state.autoRead && currentMode === "quiz" && bake.screen === "bake" && bake.phase === "ask" && bake.q) sayEn(bake.q.speak);
});

loadState();
ensureBakery();
bake.welcome = checkDailyVisit();
renderRankBar();
renderBakeMode();
syncCurrentWeek();

</script>
</body>
</html>
