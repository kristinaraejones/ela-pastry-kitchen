<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adelyn's Word Bakery</title>
<style>
  :root {
    --sky: #cdeaf7;
    --sky-soft: #e8f6fd;
    --cream: #fdf6ec;
    --cream-dim: #f3e7d3;
    --crust: #5a3825;
    --crust-soft: #7a5238;
    --icing-pink: #e8a0ad;
    --icing-pink-deep: #d9788a;
    --butter: #f0c14b;
    --mint: #7fb88f;
    --panel: #fffaf2;
    --shelf: #c9905e;
    --mono: "Courier New", Courier, monospace;
    --serif: Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 15% 0%, rgba(255,255,255,0.5), transparent 45%),
      var(--cream);
    color: var(--crust);
    font-family: var(--serif);
    padding: 20px 14px 60px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }

  header {
    border-bottom: 3px dashed var(--icing-pink-deep);
    padding-bottom: 14px;
    margin-bottom: 18px;
  }
  .stamp {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--icing-pink-deep);
    text-transform: uppercase;
  }
  h1 {
    font-family: var(--serif);
    font-size: clamp(24px, 6vw, 34px);
    margin: 6px 0 4px;
    color: var(--crust);
  }
  .subtitle { color: var(--crust-soft); font-size: 14px; font-style: italic; }

  .rank-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--panel);
    border: 1px solid var(--cream-dim);
    border-radius: 14px;
    padding: 10px 16px;
    margin-bottom: 18px;
    font-family: var(--mono);
    font-size: 13px;
    box-shadow: 0 2px 6px rgba(90,56,37,0.08);
    flex-wrap: wrap;
    gap: 6px;
  }
  .rank-bar .rank-name { color: var(--icing-pink-deep); font-weight: bold; }
  .rank-bar .sprinkles { color: var(--butter); font-weight: bold; }
  .rank-bar .day-streak { color: var(--mint); }

  .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    background: transparent;
    color: var(--crust-soft);
    border: 1px solid var(--cream-dim);
    padding: 8px 14px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .tab:hover { border-color: var(--icing-pink-deep); color: var(--crust); }
  .tab.active {
    background: var(--icing-pink-deep);
    color: #fff;
    border-color: var(--icing-pink-deep);
    font-weight: bold;
  }

  .card {
    background: var(--panel);
    color: var(--crust);
    border-radius: 16px;
    padding: 26px 22px;
    box-shadow: 0 10px 28px rgba(90,56,37,0.16);
    position: relative;
    min-height: 280px;
    border: 1px solid var(--cream-dim);
  }

  /* ---- Intro / welcome-back screen ---- */
  .intro-emoji { font-size: 46px; margin-bottom: 6px; }
  .intro-title {
    font-family: var(--serif);
    font-size: 24px;
    font-weight: bold;
    margin: 0 0 10px;
  }
  .intro-body { font-size: 15px; line-height: 1.6; margin-bottom: 20px; }
  .begin-btn {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    background: var(--icing-pink-deep);
    color: #fff;
    border: none;
    border-radius: 20px;
    padding: 12px 22px;
    cursor: pointer;
  }
  .begin-btn:hover { background: #c2606f; }

  /* ---- Customer / mascot ---- */
  .customer-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 16px;
  }
  .customer-avatar { font-size: 32px; line-height: 1; }
  .speech-bubble {
    position: relative;
    background: var(--sky-soft);
    border: 1.5px solid var(--sky);
    border-radius: 14px;
    padding: 10px 14px;
    font-size: 14px;
    line-height: 1.5;
    flex: 1;
  }
  .speech-bubble .customer-name { font-weight: bold; color: var(--crust-soft); }
  .special-flag {
    display: inline-block;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    background: var(--butter);
    color: var(--crust);
    border-radius: 10px;
    padding: 3px 8px;
    margin-bottom: 8px;
  }
  .rush-flag {
    display: inline-block;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    background: var(--icing-pink-deep);
    color: #fff;
    border-radius: 10px;
    padding: 3px 8px;
    margin-bottom: 8px;
    margin-left: 6px;
    animation: rush-pulse 0.8s ease-in-out infinite;
  }
  .rush-flag.rush-closed { animation: none; background: var(--crust-soft); }
  @keyframes rush-pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.07); }
  }
  .rush-bar-track {
    height: 6px;
    background: var(--cream-dim);
    border-radius: 3px;
    overflow: hidden;
    margin: 2px 0 14px;
  }
  .rush-bar-fill {
    height: 100%;
    background: var(--icing-pink-deep);
    width: 100%;
  }

  .ticket-label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--icing-pink-deep);
    margin-bottom: 8px;
  }
  .ticket-label.review { color: var(--mint); }

  .word-display {
    font-family: var(--serif);
    font-size: 28px;
    font-weight: bold;
    margin: 2px 0 4px;
    color: var(--crust);
  }
  .root-note {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--crust-soft);
    margin-bottom: 14px;
  }

  .options { display: flex; flex-direction: column; gap: 10px; }
  .option-btn {
    text-align: left;
    background: #fff;
    border: 1.5px solid var(--cream-dim);
    border-radius: 10px;
    padding: 12px 14px;
    font-family: var(--serif);
    font-size: 15px;
    cursor: pointer;
    transition: all 0.12s ease;
    color: var(--crust);
  }
  .option-btn:hover:not(:disabled) { border-color: var(--icing-pink-deep); background: #fffdf9; transform: translateY(-1px); }
  .option-btn.correct { background: #e2f1e6; border-color: var(--mint); animation: pop 0.35s ease; }
  .option-btn.wrong { background: #f9e3e6; border-color: var(--icing-pink-deep); }
  .option-btn:disabled { cursor: default; }

  @keyframes pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.04); }
    100% { transform: scale(1); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }
  .card.shake-it { animation: shake 0.3s ease; }

  .feedback {
    margin-top: 16px;
    font-family: var(--mono);
    font-size: 13px;
    min-height: 20px;
  }
  .feedback.good { color: #3d6b47; }
  .feedback.bad { color: var(--icing-pink-deep); }
  .combo-tag {
    color: var(--butter);
    font-weight: bold;
    margin-left: 8px;
    display: inline-block;
    animation: combo-pop 0.4s ease;
  }
  .combo-tag.tier2 { color: #e8862c; }
  .combo-tag.tier3 { color: var(--icing-pink-deep); font-size: 1.12em; }
  @keyframes combo-pop {
    0% { transform: scale(0.5) rotate(-8deg); opacity: 0; }
    60% { transform: scale(1.18) rotate(4deg); opacity: 1; }
    100% { transform: scale(1) rotate(0); }
  }

  .fly-point {
    position: fixed;
    font-family: var(--mono);
    font-weight: bold;
    font-size: 15px;
    color: var(--butter);
    pointer-events: none;
    z-index: 998;
    white-space: nowrap;
  }

  .next-btn {
    margin-top: 18px;
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    background: var(--crust);
    color: var(--butter);
    border: none;
    border-radius: 20px;
    padding: 10px 20px;
    cursor: pointer;
    display: none;
  }
  .next-btn.show { display: inline-block; }
  .next-btn:hover { background: var(--crust-soft); }

  /* ---- Match mode ---- */
  .match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; }
  .match-col-label {
    font-family: var(--mono); font-size: 10px; letter-spacing: 1.5px;
    text-transform: uppercase; color: var(--crust-soft); margin-bottom: 6px;
  }
  .match-item {
    background: #fff;
    border: 1.5px solid var(--cream-dim);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    cursor: pointer;
    margin-bottom: 8px;
  }
  .match-item.selected { border-color: var(--butter); background: #fff8e2; }
  .match-item.matched { background: #e2f1e6; border-color: var(--mint); opacity: 0.7; cursor: default; }
  .match-item.wrong-flash { background: #f9e3e6; border-color: var(--icing-pink-deep); }

  .empty-state {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--crust-soft);
    text-align: center;
    padding: 30px 10px;
  }

  /* ---- My Bakery tab: decorate-the-cake scene ---- */
  .shop-scene {
    background: var(--sky-soft);
    border-radius: 14px;
    padding: 0;
    margin-bottom: 20px;
    height: 270px;
    position: relative;
    overflow: hidden;
  }
  .cake-stand-label {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    background: #fff;
    border: 1.5px solid var(--icing-pink-deep);
    border-radius: 20px;
    padding: 4px 12px;
    color: var(--icing-pink-deep);
    white-space: nowrap;
    z-index: 3;
  }
  .cake {
    position: absolute;
    bottom: 46px;
    left: 50%;
    transform: translateX(-50%);
    width: 62%;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 1;
  }
  .cake .tier-top {
    width: 60%;
    height: 46px;
    background: linear-gradient(180deg, #fff9f0 0%, #ffeccb 100%);
    border: 3px solid var(--crust-soft);
    border-radius: 10px;
    margin-bottom: -3px;
  }
  .cake .tier-bottom {
    width: 100%;
    height: 62px;
    background: linear-gradient(180deg, #fbe3ea 0%, #f3bdcb 100%);
    border: 3px solid var(--crust-soft);
    border-radius: 10px;
  }
  .cake-plate {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    width: 74%;
    height: 16px;
    background: var(--shelf);
    border-radius: 50%;
    box-shadow: 0 3px 0 var(--crust-soft);
    z-index: 0;
  }
  .cake-table {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 30px;
    background: var(--crust-soft);
  }
  .decor-slots {
    position: absolute;
    top: 15%;
    left: 12%;
    right: 12%;
    bottom: 20%;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(3, 1fr);
    align-items: center;
    justify-items: center;
    z-index: 2;
  }
  .decor-slot {
    font-size: 22px;
    filter: grayscale(1) opacity(0.22);
    transition: filter 0.3s ease;
  }
  .decor-slot.owned {
    visibility: hidden;
  }
  .cake-topping {
    position: absolute;
    font-size: 26px;
    cursor: grab;
    z-index: 4;
    touch-action: none;
    user-select: none;
    animation: bounce-in 0.35s ease;
  }
  .cake-topping.dragging {
    cursor: grabbing;
    transform: scale(1.18);
    filter: drop-shadow(0 4px 6px rgba(90,56,37,0.35));
    z-index: 5;
  }
  .cake-hint {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--crust-soft);
    margin: -6px 0 14px;
  }

  .box-section-title {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--icing-pink-deep);
    margin: 18px 0 10px;
  }
  .treat-shelf {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    font-size: 30px;
    background: #fff;
    border: 1px dashed var(--cream-dim);
    border-radius: 10px;
    padding: 14px;
    min-height: 50px;
  }
  .treat-shelf .treat { animation: bounce-in 0.3s ease; }
  @keyframes bounce-in {
    0% { transform: scale(0.4); opacity: 0; }
    70% { transform: scale(1.1); opacity: 1; }
    100% { transform: scale(1); }
  }
  .shop-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
  }
  .shop-item {
    background: #fff;
    border: 1px solid var(--cream-dim);
    border-radius: 10px;
    padding: 10px;
    text-align: center;
    font-size: 13px;
  }
  .shop-item .shop-emoji { font-size: 28px; display: block; margin-bottom: 4px; }
  .shop-buy-btn {
    margin-top: 6px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    background: var(--icing-pink-deep);
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 6px 10px;
    cursor: pointer;
    width: 100%;
  }
  .shop-buy-btn:disabled { background: var(--cream-dim); color: var(--crust-soft); cursor: default; }
  .shop-buy-btn.owned { background: var(--mint); }

  .parent-settings {
    margin-top: 22px;
    border: 1px dashed var(--cream-dim);
    border-radius: 10px;
    padding: 10px 14px;
  }
  .parent-settings summary {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--crust-soft);
    cursor: pointer;
  }
  .settings-body { margin-top: 10px; font-size: 13px; }
  .settings-body input[type="number"] {
    width: 60px;
    padding: 4px 6px;
    border: 1px solid var(--cream-dim);
    border-radius: 6px;
    font-size: 13px;
    margin-top: 4px;
  }
  .settings-save-btn {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    background: var(--crust);
    color: var(--butter);
    border: none;
    border-radius: 14px;
    padding: 6px 12px;
    margin-left: 8px;
    cursor: pointer;
  }
  .settings-note {
    display: block;
    color: var(--crust-soft);
    font-size: 11px;
    margin-top: 8px;
    line-height: 1.5;
  }
  .parent-report {
    max-height: 200px;
    overflow-y: auto;
    margin-bottom: 6px;
  }
  .report-list { display: flex; flex-direction: column; gap: 6px; }
  .report-row {
    font-size: 12px;
    padding: 6px 8px;
    border-radius: 8px;
    border: 1px solid var(--cream-dim);
  }
  .report-row.report-correct { border-color: #b9dcae; background: #f2f9ee; }
  .report-row.report-wrong { border-color: #f0b8b8; background: #fdf0f0; }
  .report-row .settings-note { margin-top: 2px; }

  footer {
    text-align: center;
    margin-top: 22px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--crust-soft);
    letter-spacing: 1px;
  }

  @media (max-width: 480px) {
    .match-grid { grid-template-columns: 1fr; }
  }

  .confetti-piece {
    position: fixed;
    top: -10px;
    width: 8px;
    height: 14px;
    opacity: 0.9;
    pointer-events: none;
    z-index: 999;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="stamp">The Vocabulary Bakeshop</div>
    <h1>ADELYN'S WORD BAKERY</h1>
    <div class="subtitle">Run the counter, serve every customer, and grow your very own bakery.</div>
  </header>

  <div class="rank-bar">
    <div><span class="rank-name" id="rankName">Kitchen Helper</span></div>
    <div class="sprinkles" id="sprinklesDisplay">✨ 0</div>
    <div class="day-streak" id="dayStreakDisplay">🔥 0 day streak</div>
  </div>

  <div class="tabs">
    <button class="tab active" data-mode="quiz">Bake!</button>
    <button class="tab" data-mode="match">Match Orders</button>
    <button class="tab" data-mode="shop">My Bakery</button>
  </div>

  <div class="card" id="gameCard">
    <!-- populated by JS -->
  </div>

  <footer>ADELYN'S WORD BAKERY &middot; Vocabulary, Grade 4 &middot; works fully offline, saved right here on this device</footer>
</div>

<script>
// ---------- Word bank ----------
// Pulled straight from Adelyn's real Vocabulary & Reading curriculum
// (root words + frequency words, all 36 weeks).
//
// HOW TO ADVANCE HER PACING:
// state.currentWeek (default 1) is the highest week she's been taught —
// it should always match her current_week pointer in the ELA Pastry
// Kitchen app. It's editable right in the game: My Bakery tab -> Parent
// Settings. Words from any week ABOVE currentWeek are never shown, in
// quiz, match, or the treat shelf — she can't stumble onto vocab she
// hasn't been taught yet. The current week and the one before it count
// as "active" (shown most often); everything taught before that becomes
// review material, cycled back in less often, with anything she's missed
// prioritized until she gets it right twice in a row.
const ACTIVE_WINDOW = 2;

d":"biography","type":"root","rootFamily":"GRAPH / GRAM — write (Greek root)","rootNote":"bio- (life) + graph (write)","definition":"a true story of a person's life written by someone else","example":"Kenley read a biography about a famous inventor."},{"id":"w2_photograph","week":2,"word":"photograph","type":"root","rootFamily":"GRAPH / GRAM — write (Greek root)","rootNote":"photo- (light) + graph (write)","definition":"a picture made using light, usually with a camera","example":"Dad took a photograph of the sunset over the mountains."},{"id":"w2_determine","week":2,"word":"determine","type":"frequency","rootFamily":null,"rootNote":null,"definition":"to decide something after careful thought; to figure out","example":"They used a map to determine the fastest route to the museum."},{"id":"w2_additional","week":2,"word":"additional","type":"frequency","rootFamily":null,"rootNote":null,"definition":"extra; more than what is already there","example":"The teacher gave Adelyn an additional worksheet for practice."},{"id":"w2_recognize","week":2,"word":"recognize","type":"frequency","rootFamily":null,"rootNote":null,"definition":"to know or identify someone or something from before","example":"Adelyn didn't recognize the city at night with all the lights."},{"id":"w3_transport","week":3,"word":"transport","type":"root","rootFamily":"PORT — carry (Latin root)","rootNote":"trans- (across) + port (carry)","definition":"to carry people or things from one place to another","example":"A big ship can transport hundreds of shipping containers across the ocean."},{"id":"w3_portable","week":3,"word":"portable","type":"root","rootFamily":"PORT — carry (Latin root)","rootNote":"port (carry) + -able (able to be)","definition":"able to be carried or moved easily","example":"Adelyn packed a portable speaker for the long train ride."},{"id":"w3_report","week":3,"word":"report","type":"root","rootFamily":"PORT — carry (Latin root)","rootNote":"re- (back) + port (carry)","definition":"to c const WRONG_LINES = ["Oops, back in the oven.", "Not quite — let's try the next one.", "So close! Correct one's highlighted.", "Mixed up the recipe — no worries!"];

// Default landing spot for each SHOP_ITEMS[i] the first time it's bought
// (same 4x3 layout the faded "ghost" grid uses) — expressed as % of the
// cake scene box, since toppings are dragged/stored in that unit.
const DEFAULT_DECOR_POS = SHOP_ITEMS.map((_, i) => {
  const col = i % 4;
  const row = Math.floor(i / 4);
  return { x: 12 + 19 * (col + 0.5), y: 15 + 21.67 * (row + 0.5) };
});

const STORAGE_KEY = "adelyn-word-bakery-progress";

// Same Apps Script Web App the ELA Pastry Kitchen app itself uses (see its
// config.js) — baked in as the default so every device Adelyn plays on
// syncs (week pacing + missed-answer log) automatically, no setup needed.
// Still overridable via Parent Settings.
const DEFAULT_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzV1ftuxqDxkBbRelL0OoYRPGXTDSGwqN8-q290MF2kWHh5_X83RYWkkKZu_2fGqffH9g/exec";

// state.mastery[wordId] = { correct, wrong, needsReview, reviewRemaining, lastSeen }
let state = {
  lifetimePoints: 0,
  sprinkles: 0,
  streak: 0,
  mastery: {},
  attemptLog: [],
  roundCounter: 0,
  dayStreak: 0,
  lastVisitDate: null,
  specialDateUsed: null,
  shopOwned: {},
  decorPositions: {},
  currentWeek: 1,
  webAppUrl: "",
  lastSyncAt: null,
  lastSyncOk: null
};
let currentMode = "quiz";
let quizPool = [];
let quizIndex = 0;
let pendingSpecial = false;
const RUSH_CHANCE = 0.25;
const RUSH_WINDOW_MS = 8000;
let currentRush = null; // { deadline } while a rush order's timer is running
let rushIntervalId = null;
let matchPool = [];
let matchSelectedWord = null;
let matchSelectedDef = null;
let matchedCount = 0;
let parentSettingsOpen = false;

function todayStr() {
  const d = new Date();
  return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
}

// ---------- Storage (real localStorage — works fully offline, per device) ----------
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state = Object.assign(state, JSON.parse(raw));
  } catch (e) {
    // no saved progress yet, or storage unavailable — use defaults
  }
  if (!state.mastery) state.mastery = {};
  if (!Array.isArray(state.attemptLog)) state.attemptLog = [];
  if (!state.shopOwned) state.shopOwned = {};
  if (!state.decorPositions) state.decorPositions = {};
  if (typeof state.currentWeek !== "number" || state.currentWeek < 1) state.currentWeek = 1;
  if (typeof state.webAppUrl !== "string" || !state.webAppUrl) state.webAppUrl = DEFAULT_WEB_APP_URL;
  if (typeof state.roundCounter !== "number") state.roundCounter = 0;
  if (typeof state.lifetimePoints !== "number") state.lifetimePoints = 0;
  if (typeof state.sprinkles !== "number") state.sprinkles = 0;
  if (typeof state.streak !== "number") state.streak = 0;
  if (typeof state.dayStreak !== "number") state.dayStreak = 0;
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    console.error("Could not save progress", e);
  }
}

// ---------- Live sync with her ELA Pastry Kitchen Sheet (optional) ----------
// If a Web App URL is set (Parent Settings), pull her real current_week
// straight from the same Google Sheet/Apps Script backend that app uses,
// so this game never needs a manual update again. This is the ONLY network
// call this game ever makes — everything else stays fully offline, and if
// this fails (no internet, bad URL, etc.) it just keeps using whatever
// week was last known, silently. Never blocks or delays gameplay: it runs
// in the background and only takes effect on the next round/tab render.
async function syncCurrentWeek() {
  if (!state.webAppUrl) return;
  try {
    const sep = state.webAppUrl.includes("?") ? "&" : "?";
    const res = await fetch(state.webAppUrl + sep + "action=bootstrap&student=adelyn");
    const data = await res.json();
    const raw = data && data.ok && data.settings ? data.settings.adelyn_current_week : null;
    const week = parseInt(raw, 10);
    if (week >= 1 && week <= 36) state.currentWeek = week;
    state.lastSyncOk = true;
  } catch (e) {
    state.lastSyncOk = false;
  }
  state.lastSyncAt = new Date().toISOString();
  saveState();
  if (currentMode === "shop") renderShop();
}

function getMastery(id) {
  if (!state.mastery[id]) {
    state.mastery[id] = { correct: 0, wrong: 0, needsReview: false, reviewRemaining: 0, lastSeen: 0 };
  }
  return state.mastery[id];
}

// Parent visibility: keep a capped local log of actual answers (works
// offline, same device) and push each one to the same Google
// Sheet/Apps Script backend syncCurrentWeek() already talks to, if a Web
// App URL is set — so Kristina can also check from her own phone/computer.
// Best-effort only: never blocks gameplay if it fails or isn't configured.
const MAX_ATTEMPT_LOG = 50;

function logAttempt(detail) {
  const entry = {
    timestamp: new Date().toISOString(),
    subject: detail.subject || "vocabulary",
    word: detail.word,
    question: detail.question || "",
    givenAnswer: detail.givenAnswer,
    correctAnswer: detail.correctAnswer,
    correct: detail.wasCorrect,
  };
  if (!Array.isArray(state.attemptLog)) state.attemptLog = [];
  state.attemptLog.push(entry);
  while (state.attemptLog.length > MAX_ATTEMPT_LOG) state.attemptLog.shift();

  if (!state.webAppUrl) return;
  fetch(state.webAppUrl, {
    method: "POST",
    body: JSON.stringify({
      action: "logAnswer",
      student: "adelyn",
      game: "Word Bakery",
      subject: entry.subject,
      word: entry.word,
      question: entry.question,
      given_answer: entry.givenAnswer,
      correct_answer: entry.correctAnswer,
      correct: entry.correct,
    }),
  }).catch(() => {});
}

function recordAnswer(id, isCorrect, detail) {
  const m = getMastery(id);
  m.lastSeen = state.roundCounter;
  if (detail) logAttempt(detail);
  if (isCorrect) {
    m.correct += 1;
    if (m.needsReview) {
      m.reviewRemaining -= 1;
      if (m.reviewRemaining <= 0) m.needsReview = false;
    }
  } else {
    m.wrong += 1;
    m.needsReview = true;
    m.reviewRemaining = 2;
  }
}

function treatFor(wordId) {
  let sum = 0;
  for (let i = 0; i < wordId.length; i++) sum += wordId.charCodeAt(i);
  return TREAT_EMOJI[sum % TREAT_EMOJI.length];
}

function randomCustomer() { return CUSTOMERS[Math.floor(Math.random() * CUSTOMERS.length)]; }
function randomLine(list) { return list[Math.floor(Math.random() * list.length)]; }

// Combo tag shown after a correct answer — grows louder as the streak climbs.
function comboTagHtml(streak) {
  if (streak <= 1) return "";
  const tier = streak >= 8 ? 3 : streak >= 4 ? 2 : 1;
  const icon = tier === 3 ? "🔥🔥" : tier === 2 ? "🔥" : "⚡";
  return '<span class="combo-tag tier' + tier + '">' + icon + ' Combo x' + streak + '</span>';
}

// Flies a "+N ✨" label from wherever she just answered to the sprinkles
// counter in the rank bar — purely visual, the real count already updated.
function flyPoints(originEl, amount) {
  const target = document.getElementById("sprinklesDisplay");
  if (!originEl || !target) return;
  const startRect = originEl.getBoundingClientRect();
  const endRect = target.getBoundingClientRect();
  const el = document.createElement("div");
  el.className = "fly-point";
  el.textContent = "+" + amount + " ✨";
  el.style.left = (startRect.left + startRect.width / 2) + "px";
  el.style.top = startRect.top + "px";
  document.body.appendChild(el);
  const dx = (endRect.left + endRect.width / 2) - (startRect.left + startRect.width / 2);
  const dy = endRect.top - startRect.top;
  const anim = el.animate(
    [
      { transform: "translate(0,0) scale(1)", opacity: 1 },
      { transform: "translate(" + dx + "px," + dy + "px) scale(0.55)", opacity: 0.15 }
    ],
    { duration: 650, easing: "cubic-bezier(.3,.6,.4,1)" }
  );
  anim.onfinish = () => el.remove();
}

function renderRankBar() {
  let rank = RANKS[0].name;
  for (const r of RANKS) { if (state.lifetimePoints >= r.min) rank = r.name; }
  document.getElementById("rankName").textContent = rank;
  document.getElementById("sprinklesDisplay").textContent = "\u2728 " + state.sprinkles;
  document.getElementById("dayStreakDisplay").textContent = "\uD83D\uDD25 " + state.dayStreak + " day streak";
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// "Taught" = week <= her current pointer — a hard cutoff. Words above it
// never enter any pool, so she can never see vocab she hasn't reached yet.
function isTaught(item) { return item.week <= state.currentWeek; }
function isActive(item) { return item.week <= state.currentWeek && item.week > state.currentWeek - ACTIVE_WINDOW; }

// ---------- Round pool builder ----------
function buildRoundPool(missedSlots, generalSlots) {
  state.roundCounter++;
  const active = shuffle(WORDS.filter(isActive));
  const older = WORDS.filter(w => isTaught(w) && !isActive(w));

  const missed = older.filter(w => getMastery(w.id).needsReview)
    .sort((a, b) => getMastery(a.id).lastSeen - getMastery(b.id).lastSeen)
    .slice(0, missedSlots);

  const missedIds = new Set(missed.map(w => w.id));
  const general = older.filter(w => !missedIds.has(w.id))
    .sort((a, b) => getMastery(a.id).lastSeen - getMastery(b.id).lastSeen)
    .slice(0, generalSlots);

  const pool = shuffle(active.concat(missed, general));
  pool.forEach(w => { getMastery(w.id).lastSeen = state.roundCounter; });
  return pool;
}

// ---------- Distractor helpers ----------
function pickDistractorDefinitions(item, count) {
  const others = WORDS.filter(w => w.id !== item.id && w.definition !== item.definition);
  return shuffle(others).slice(0, count).map(w => w.definition);
}

function pickDistractorWords(item, count) {
  const others = WORDS.filter(w => w.id !== item.id && w.word.toLowerCase() !== item.word.toLowerCase());
  return shuffle(others).slice(0, count).map(w => w.word);
}

function blankOutWord(example, word) {
  const tokens = example.match(/[A-Za-z']+/g) || [];
  const wLower = word.toLowerCase();
  let best = null;
  let bestScore = 0;
  for (const t of tokens) {
    const tLower = t.toLowerCase();
    let score = 0;
    const max = Math.min(tLower.length, wLower.length);
    while (score < max && tLower[score] === wLower[score]) score++;
    if (tLower === wLower) score += 100;
    if (score > bestScore && score >= Math.min(4, wLower.length)) {
      bestScore = score;
      best = t;
    }
  }
  const target = best || word;
  const re = new RegExp("\\b" + target.replace(/[.*+?^${}()|[\]\\\\]/g, "\\$&") + "\\b");
  return example.replace(re, "_____");
}

function rootNoteLine(item) {
  if (item.type === "root") return "Root family: " + item.rootFamily;
  return "Frequency word — shows up all over her reading";
}

// ---------- Daily visit / streak / welcome banner ----------
function checkDailyVisit() {
  const today = todayStr();
  if (state.lastVisitDate === today) return false;

  const y = new Date();
  y.setDate(y.getDate() - 1);
  const yesterday = y.getFullYear() + "-" + (y.getMonth() + 1) + "-" + y.getDate();

  state.dayStreak = state.lastVisitDate === yesterday ? state.dayStreak + 1 : 1;
  state.lastVisitDate = today;
  state.sprinkles += 15;
  saveState();
  return true;
}

function renderWelcomeBanner() {
  const card = document.getElementById("gameCard");
  card.innerHTML = `
    <div class="intro-emoji">\uD83E\uDDC1</div>
    <div class="intro-title">Welcome back to the bakery!</div>
    <div class="intro-body">Day streak: <b>${state.dayStreak} \uD83D\uDD25</b> \u2014 here's <b>+15 \u2728</b> for showing up today.
    The counter's getting busy \u2014 ready to take some orders?</div>
    <button class="begin-btn" id="beginDayBtn">Open the bakery \u2192</button>
  `;
  document.getElementById("beginDayBtn").onclick = () => {
    renderRankBar();
    startQuiz();
  };
}

// ---------- Quiz mode (Bake!) ----------
function startQuiz() {
  quizPool = buildRoundPool(3, 2);
  quizIndex = 0;
  pendingSpecial = state.specialDateUsed !== todayStr();
  saveState();
  renderQuizQuestion();
}

// Stops the rush-order countdown (leaving the question, answering, or
// bailing out of quiz mode entirely) so it never keeps ticking in the
// background or leaks a stale interval onto the next question.
function clearRushTimer() {
  if (rushIntervalId !== null) { clearInterval(rushIntervalId); rushIntervalId = null; }
  currentRush = null;
}

function renderQuizQuestion() {
  clearRushTimer();
  const card = document.getElementById("gameCard");
  card.classList.remove("shake-it");
  if (quizIndex >= quizPool.length) {
    card.innerHTML = '<div class="empty-state">\uD83C\uDF89 The line has cleared \u2014 great shift! Come back for another batch of orders whenever you like.<br><br>' +
      '<button class="next-btn show" id="restartQuiz">Start a new batch</button></div>';
    document.getElementById("restartQuiz").onclick = startQuiz;
    return;
  }
  const item = quizPool[quizIndex];
  const useDefinitionQuestion = Math.random() < 0.55;
  const isReview = !isActive(item);
  const isSpecial = quizIndex === 0 && pendingSpecial;
  const isRush = Math.random() < RUSH_CHANCE;
  const customer = randomCustomer();
  const ticketLabel = isReview
    ? "Order #" + (quizIndex + 1) + " of " + quizPool.length + " \u2014 \u21BB RE-BAKE"
    : "Order #" + (quizIndex + 1) + " of " + quizPool.length;

  let optionsHtml = "";
  let askLine = "";

  if (useDefinitionQuestion) {
    const opts = shuffle([item.definition, ...pickDistractorDefinitions(item, 3)]);
    optionsHtml = opts.map(o =>
      `<button class="option-btn" data-correct="${o === item.definition}">${o}</button>`
    ).join("");
    askLine = "\u201cI keep hearing the word \u2018" + item.word + "\u2019 \u2014 what does that even mean?\u201d";
  } else {
    const blanked = blankOutWord(item.example, item.word);
    const opts = shuffle([item.word, ...pickDistractorWords(item, 3)]);
    optionsHtml = opts.map(o =>
      `<button class="option-btn" data-correct="${o.toLowerCase() === item.word.toLowerCase()}">${o}</button>`
    ).join("");
    askLine = "\u201cCan you fill in my order note? \u2018" + blanked + "\u2019\u201d";
  }

  // For a fill-in-the-blank order, the word itself is the answer — showing
  // it above the sentence would give it away for free. Only the
  // definition-question shows the word up front; the fill-in-blank reveals
  // word + root note as part of the feedback, after she's answered.
  const wordBlockHtml = useDefinitionQuestion
    ? `<div class="word-display">${item.word}</div><div class="root-note">${rootNoteLine(item)}</div>`
    : "";

  card.innerHTML = `
    <div class="ticket-label ${isReview ? 'review' : ''}">${ticketLabel}</div>
    ${isSpecial ? '<div class="special-flag">\u2B50 Today\'s Special \u2014 Double Sprinkles</div>' : ''}
    ${isRush ? '<div class="rush-flag" id="rushFlag">\uD83C\uDFC3 Rush order \u2014 answer fast for 2x!</div>' : ''}
    <div class="customer-row">
      <div class="customer-avatar">${customer.emoji}</div>
      <div class="speech-bubble"><span class="customer-name">${customer.name}:</span> ${askLine}</div>
    </div>
    ${isRush ? '<div class="rush-bar-track"><div class="rush-bar-fill" id="rushBarFill"></div></div>' : ''}
    <div id="wordBlock">${wordBlockHtml}</div>
    <div class="options">${optionsHtml}</div>
    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="nextBtn">Next order \u2192</button>
  `;

  card.querySelectorAll(".option-btn").forEach(btn => {
    btn.addEventListener("click", () => handleQuizAnswer(btn, item, isSpecial, useDefinitionQuestion));
  });

  if (isRush) {
    currentRush = { deadline: Date.now() + RUSH_WINDOW_MS };
    const fill = document.getElementById("rushBarFill");
    rushIntervalId = setInterval(() => {
      const remaining = currentRush.deadline - Date.now();
      if (remaining <= 0) {
        fill.style.width = "0%";
        document.getElementById("rushFlag").textContent = "Rush window closed \u2014 still worth normal sprinkles.";
        document.getElementById("rushFlag").classList.add("rush-closed");
        clearInterval(rushIntervalId);
        rushIntervalId = null;
        return;
      }
      fill.style.width = (remaining / RUSH_WINDOW_MS * 100) + "%";
    }, 100);
  }
}

function handleQuizAnswer(btn, item, isSpecial, useDefinitionQuestion) {
  const allBtns = document.querySelectorAll(".option-btn");
  allBtns.forEach(b => b.disabled = true);
  const isCorrect = btn.dataset.correct === "true";
  const rushBonus = !!currentRush && Date.now() <= currentRush.deadline;
  clearRushTimer();
  const fb = document.getElementById("feedback");

  recordAnswer(item.id, isCorrect, {
    subject: "vocabulary",
    word: item.word,
    question: useDefinitionQuestion ? "What does this word mean?" : "Fill in the blank",
    givenAnswer: btn.textContent,
    correctAnswer: useDefinitionQuestion ? item.definition : item.word,
    wasCorrect: isCorrect,
  });
  if (isSpecial) { state.specialDateUsed = todayStr(); pendingSpecial = false; }

  if (!useDefinitionQuestion) {
    document.getElementById("wordBlock").innerHTML =
      `<div class="word-display">${item.word}</div><div class="root-note">${rootNoteLine(item)} \u2014 ${item.definition}</div>`;
  }

  if (isCorrect) {
    btn.classList.add("correct");
    let gain = 10 + Math.min(state.streak, 10);
    if (isSpecial) gain *= 2;
    if (rushBonus) gain *= 2;
    state.lifetimePoints += gain;
    state.sprinkles += gain;
    state.streak += 1;
    fb.className = "feedback good";
    fb.innerHTML = "\u2713 " + randomLine(CORRECT_LINES) + " +" + gain + " \u2728" +
      (rushBonus ? '<span class="combo-tag tier2">\ud83c\udfc3 Rush bonus!</span>' : "") +
      comboTagHtml(state.streak);
    flyPoints(btn, gain);
    if (state.streak > 0 && state.streak % 4 === 0) celebrate(state.streak % 8 !== 0);
  } else {
    btn.classList.add("wrong");
    allBtns.forEach(b => { if (b.dataset.correct === "true") b.classList.add("correct"); });
    state.streak = 0;
    fb.className = "feedback bad";
    fb.textContent = "\u2717 " + randomLine(WRONG_LINES);
    document.getElementById("gameCard").classList.add("shake-it");
  }

  renderRankBar();
  saveState();
  document.getElementById("nextBtn").classList.add("show");
  document.getElementById("nextBtn").onclick = () => {
    quizIndex++;
    renderQuizQuestion();
  };
}

// ---------- Match mode (Match Orders) ----------
function startMatch() {
  matchPool = buildRoundPool(2, 1).slice(0, 6);
  matchSelectedWord = null;
  matchSelectedDef = null;
  matchedCount = 0;
  saveState();
  renderMatch();
}

function renderMatch() {
  const card = document.getElementById("gameCard");
  const wordsCol = shuffle(matchPool);
  const defsCol = shuffle(matchPool);

  card.innerHTML = `
    <div class="ticket-label">Match Orders</div>
    <div class="customer-row">
      <div class="customer-avatar">\uD83E\uDDD1\u200D\uD83C\uDF73</div>
      <div class="speech-bubble">The counter's stacked with mixed-up order tickets \u2014 match each word to its definition before they pile up!</div>
    </div>
    <div class="match-grid">
      <div>
        <div class="match-col-label">Words</div>
        <div id="wordsCol"></div>
      </div>
      <div>
        <div class="match-col-label">Definitions</div>
        <div id="defsCol"></div>
      </div>
    </div>
    <div class="feedback" id="matchFeedback"></div>
    <button class="next-btn" id="newMatchBtn">New batch of tickets</button>
  `;

  const wordsColEl = document.getElementById("wordsCol");
  const defsColEl = document.getElementById("defsCol");

  wordsCol.forEach(item => {
    const div = document.createElement("div");
    const isReview = !isActive(item);
    div.className = "match-item";
    div.textContent = (isReview ? "\u21BB " : "") + item.word;
    div.title = isReview ? "Re-bake \u2014 practice word" : "";
    div.dataset.word = item.word;
    div.addEventListener("click", () => selectMatchWord(div, item));
    wordsColEl.appendChild(div);
  });

  defsCol.forEach(item => {
    const div = document.createElement("div");
    div.className = "match-item";
    div.textContent = item.definition;
    div.dataset.word = item.word;
    div.addEventListener("click", () => selectMatchDef(div, item));
    defsColEl.appendChild(div);
  });

  document.getElementById("newMatchBtn").classList.add("show");
  document.getElementById("newMatchBtn").onclick = startMatch;
}

function selectMatchWord(el, item) {
  if (el.classList.contains("matched")) return;
  document.querySelectorAll("#wordsCol .match-item").forEach(e => e.classList.remove("selected"));
  el.classList.add("selected");
  matchSelectedWord = { el, item };
  tryMatch();
}

function selectMatchDef(el, item) {
  if (el.classList.contains("matched")) return;
  document.querySelectorAll("#defsCol .match-item").forEach(e => e.classList.remove("selected"));
  el.classList.add("selected");
  matchSelectedDef = { el, item };
  tryMatch();
}

function tryMatch() {
  if (!matchSelectedWord || !matchSelectedDef) return;
  const fb = document.getElementById("matchFeedback");
  const wordItem = matchSelectedWord.item;
  const defItem = matchSelectedDef.item;
  const isMatch = wordItem.word === defItem.word;
  recordAnswer(wordItem.id, isMatch, {
    subject: "vocabulary",
    word: wordItem.word,
    question: "Match the word to its definition",
    givenAnswer: defItem.definition,
    correctAnswer: wordItem.definition,
    wasCorrect: isMatch,
  });

  if (isMatch) {
    matchSelectedWord.el.classList.remove("selected");
    matchSelectedDef.el.classList.remove("selected");
    matchSelectedWord.el.classList.add("matched");
    matchSelectedDef.el.classList.add("matched");
    const gain = 8 + Math.min(state.streak, 10);
    state.lifetimePoints += gain;
    state.sprinkles += gain;
    state.streak += 1;
    matchedCount++;
    fb.className = "feedback good";
    fb.innerHTML = "\u2713 Match! +" + gain + " \u2728 (" + matchedCount + " of " + matchPool.length + " orders filled)" + comboTagHtml(state.streak);
    flyPoints(matchSelectedDef.el, gain);
    if (matchedCount === matchPool.length) {
      fb.innerHTML += " \u2014 Whole board cleared!";
      celebrate();
    } else if (state.streak > 0 && state.streak % 4 === 0) {
      celebrate(state.streak % 8 !== 0);
    }
  } else {
    matchSelectedWord.el.classList.add("wrong-flash");
    matchSelectedDef.el.classList.add("wrong-flash");
    state.streak = 0;
    fb.className = "feedback bad";
    fb.textContent = "\u2717 Not a match. Try again.";
    const w = matchSelectedWord, d = matchSelectedDef;
    setTimeout(() => {
      w.el.classList.remove("selected", "wrong-flash");
      d.el.classList.remove("selected", "wrong-flash");
    }, 500);
  }
  matchSelectedWord = null;
  matchSelectedDef = null;
  renderRankBar();
  saveState();
}

// ---------- My Bakery (shop + treat collection) ----------
function renderShop() {
  const card = document.getElementById("gameCard");
  const ownedCount = SHOP_ITEMS.filter(it => state.shopOwned[it.id]).length;
  const masteredWords = WORDS.filter(w => {
    const m = state.mastery[w.id];
    return m && m.correct > 0 && !m.needsReview;
  });

  const decorSlotsHtml = SHOP_ITEMS.map(it => {
    const owned = !!state.shopOwned[it.id];
    return `<span class="decor-slot ${owned ? 'owned' : ''}" title="${owned ? it.name : it.name + ' (not bought yet)'}">${it.emoji}</span>`;
  }).join("");

  const toppingsHtml = SHOP_ITEMS.map((it, i) => {
    if (!state.shopOwned[it.id]) return "";
    const pos = state.decorPositions[it.id] || DEFAULT_DECOR_POS[i];
    return `<span class="cake-topping" data-id="${it.id}" title="${it.name} \u2014 drag me!" style="left:${pos.x}%; top:${pos.y}%;">${it.emoji}</span>`;
  }).join("");

  const shelfTreats = masteredWords.length
    ? masteredWords.map(w => `<span class="treat" title="${w.word}">${treatFor(w.id)}</span>`).join("")
    : '<span style="font-size:13px; font-family: var(--mono); color: var(--crust-soft);">No treats baked yet \u2014 master a word in Bake! to add one to the shelf.</span>';

  const shopHtml = SHOP_ITEMS.map(it => {
    const owned = !!state.shopOwned[it.id];
    const canAfford = state.sprinkles >= it.cost;
    return `<div class="shop-item">
      <span class="shop-emoji">${it.emoji}</span>
      ${it.name}<br><span style="color: var(--crust-soft); font-size:11px;">\u2728 ${it.cost}</span>
      <button class="shop-buy-btn ${owned ? 'owned' : ''}" data-id="${it.id}" ${owned || !canAfford ? 'disabled' : ''}>
        ${owned ? '\u2713 Placed' : canAfford ? 'Buy' : 'Need more \u2728'}
      </button>
    </div>`;
  }).join("");

  card.innerHTML = `
    <div class="ticket-label">Decorate Your Cake (${ownedCount} of ${SHOP_ITEMS.length})</div>
    <div class="cake-hint">\uD83D\uDC46 Drag any topping to move it around the cake.</div>
    <div class="shop-scene" id="cakeScene">
      <div class="cake-stand-label">Adelyn's Cake</div>
      <div class="cake">
        <div class="tier-top"></div>
        <div class="tier-bottom"></div>
      </div>
      <div class="cake-plate"></div>
      <div class="cake-table"></div>
      <div class="decor-slots">${decorSlotsHtml}</div>
      ${toppingsHtml}
    </div>
    <div class="box-section-title">Treat Shelf (${masteredWords.length} mastered)</div>
    <div class="treat-shelf">${shelfTreats}</div>
    <div class="box-section-title">Decoration Box \u2014 tap a faded item above to spot what it is, then buy it here</div>
    <div class="shop-grid">${shopHtml}</div>

    <details class="parent-settings" id="parentSettingsDetails" ${parentSettingsOpen ? "open" : ""}>
      <summary>Parent Settings</summary>
      <div class="settings-body">
        <label for="webAppUrlInput">ELA Pastry Kitchen Web App URL (auto-sync her current week):</label><br>
        <input type="text" id="webAppUrlInput" placeholder="https://script.google.com/macros/s/.../exec"
          value="${state.webAppUrl}" style="width:100%; max-width:340px;">
        <button class="settings-save-btn" id="saveUrlBtn">Save &amp; Sync Now</button>
        <p class="settings-note" id="syncStatusNote">${syncStatusLine()}</p>

        <div class="box-section-title">Words to work on</div>
        <div class="parent-report">${missedWordsReportHtml()}</div>

        <div class="box-section-title">Recent answers</div>
        <div class="parent-report">${recentAnswersHtml()}</div>

        <label for="currentWeekInput">Or set her current week by hand:</label><br>
        <input type="number" id="currentWeekInput" min="1" max="36" value="${state.currentWeek}">
        <button class="settings-save-btn" id="saveWeekBtn">Save</button>
        <span id="weekSavedNote" class="settings-note"></span>
        <p class="settings-note">Words from any week after this number stay hidden either way. With a Web
        App URL saved above, this number updates itself every time the game opens \u2014 set it by hand only
        if you're not using auto-sync, or want to override it for now.</p>
      </div>
    </details>
  `;

  card.querySelectorAll(".shop-buy-btn").forEach(btn => {
    btn.addEventListener("click", () => buyItem(btn.dataset.id));
  });

  attachDragHandlers(document.getElementById("cakeScene"));

  const detailsEl = document.getElementById("parentSettingsDetails");
  detailsEl.addEventListener("toggle", () => { parentSettingsOpen = detailsEl.open; });

  document.getElementById("saveWeekBtn").addEventListener("click", () => {
    const input = document.getElementById("currentWeekInput");
    const week = Math.max(1, Math.min(36, parseInt(input.value, 10) || 1));
    input.value = week;
    state.currentWeek = week;
    saveState();
    document.getElementById("weekSavedNote").textContent = "\u2713 Saved \u2014 now on week " + week + ".";
  });

  document.getElementById("saveUrlBtn").addEventListener("click", async () => {
    state.webAppUrl = document.getElementById("webAppUrlInput").value.trim();
    saveState();
    document.getElementById("syncStatusNote").textContent = "Syncing\u2026";
    await syncCurrentWeek();
    renderShop();
  });
}

function missedWordsReportHtml() {
  const needsReview = WORDS.filter(w => {
    const m = state.mastery[w.id];
    return m && m.needsReview;
  }).sort((a, b) => (state.mastery[b.id].wrong || 0) - (state.mastery[a.id].wrong || 0));
  if (needsReview.length === 0) {
    return '<p class="settings-note">Nothing flagged for review right now.</p>';
  }
  const rows = needsReview.map(w => {
    const m = state.mastery[w.id];
    return `<div class="report-row"><strong>${w.word}</strong> — missed ${m.wrong}× — <em>${w.definition}</em></div>`;
  }).join("");
  return `<div class="report-list">${rows}</div>`;
}

function recentAnswersHtml() {
  const log = (state.attemptLog || []).slice(-15).reverse();
  if (log.length === 0) {
    return '<p class="settings-note">No answers logged yet this session.</p>';
  }
  const rows = log.map(a => {
    const when = new Date(a.timestamp).toLocaleString();
    const detail = a.correct
      ? ""
      : ` — answered "${a.givenAnswer}", correct answer "${a.correctAnswer}"`;
    return `<div class="report-row ${a.correct ? "report-correct" : "report-wrong"}">
      ${a.correct ? "✅" : "❌"} <strong>${a.word}</strong>${detail}
      <div class="settings-note">${when}</div>
    </div>`;
  }).join("");
  return `<div class="report-list">${rows}</div>`;
}

function syncStatusLine() {
  if (!state.webAppUrl) return "No Web App URL set yet \u2014 using the week number below.";
  if (!state.lastSyncAt) return "Not synced yet \u2014 tap \u201cSave & Sync Now\u201d.";
  const when = new Date(state.lastSyncAt).toLocaleString();
  return state.lastSyncOk
    ? "\u2713 Last synced " + when + " \u2014 week " + state.currentWeek + "."
    : "\u26A0 Couldn't reach the Sheet at last try (" + when + ") \u2014 using last known week " + state.currentWeek + ".";
}

function attachDragHandlers(sceneEl) {
  sceneEl.querySelectorAll(".cake-topping").forEach(el => {
    el.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      const sceneRect = sceneEl.getBoundingClientRect();
      const startLeftPx = el.offsetLeft;
      const startTopPx = el.offsetTop;
      const startX = e.clientX;
      const startY = e.clientY;
      el.setPointerCapture(e.pointerId);
      el.classList.add("dragging");

      function onMove(ev) {
        const dx = ev.clientX - startX;
        const dy = ev.clientY - startY;
        const newLeft = Math.max(0, Math.min(sceneRect.width - el.offsetWidth, startLeftPx + dx));
        const newTop = Math.max(0, Math.min(sceneRect.height - el.offsetHeight, startTopPx + dy));
        el.style.left = newLeft + "px";
        el.style.top = newTop + "px";
      }
      function onUp(ev) {
        el.releasePointerCapture(ev.pointerId);
        el.classList.remove("dragging");
        el.removeEventListener("pointermove", onMove);
        el.removeEventListener("pointerup", onUp);
        state.decorPositions[el.dataset.id] = {
          x: (el.offsetLeft / sceneRect.width) * 100,
          y: (el.offsetTop / sceneRect.height) * 100
        };
        saveState();
      }
      el.addEventListener("pointermove", onMove);
      el.addEventListener("pointerup", onUp);
    });
  });
}

function buyItem(id) {
  const item = SHOP_ITEMS.find(it => it.id === id);
  if (!item || state.shopOwned[id] || state.sprinkles < item.cost) return;
  state.sprinkles -= item.cost;
  state.shopOwned[id] = true;
  renderRankBar();
  saveState();
  renderShop();
  playTone();
}

// ---------- Celebration (confetti + tone, no assets) ----------
// mini=true gives a smaller, quieter burst for the more frequent combo
// milestones, so the full 24-piece version still feels special.
function celebrate(mini) {
  const colors = ["#e8a0ad", "#f0c14b", "#7fb88f", "#5a3825"];
  const count = mini ? 10 : 24;
  for (let i = 0; i < count; i++) {
    const piece = document.createElement("div");
    piece.className = "confetti-piece";
    piece.style.left = Math.random() * 100 + "vw";
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.transform = "rotate(" + Math.random() * 360 + "deg)";
    document.body.appendChild(piece);
    const duration = 900 + Math.random() * 700;
    piece.animate(
      [
        { transform: piece.style.transform, top: "-10px", opacity: 1 },
        { transform: piece.style.transform, top: "100vh", opacity: 0.9 }
      ],
      { duration, easing: "ease-in" }
    );
    setTimeout(() => piece.remove(), duration + 50);
  }
  playTone(mini);
}

function playTone(soft) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const notes = soft ? [659.25, 783.99] : [523.25, 659.25, 783.99];
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.value = freq;
      osc.type = "sine";
      gain.gain.setValueAtTime(0.15, ctx.currentTime + i * 0.12);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.12 + 0.35);
      osc.connect(gain).connect(ctx.destination);
      osc.start(ctx.currentTime + i * 0.12);
      osc.stop(ctx.currentTime + i * 0.12 + 0.35);
    });
  } catch (e) {
    // Web Audio unavailable — silently skip, nothing else depends on it.
  }
}

// ---------- Tabs ----------
document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    currentMode = tab.dataset.mode;
    clearRushTimer();
    if (currentMode === "quiz") startQuiz();
    else if (currentMode === "match") startMatch();
    else renderShop();
  });
});

// ---------- Init ----------
loadState();
renderRankBar();
if (checkDailyVisit()) {
  renderWelcomeBanner();
} else {
  startQuiz();
}
// Background week sync — never blocks the screen above; if a Web App URL
// is saved, this quietly checks her real current_week and takes effect on
// the next round or the next time My Bakery is opened.
syncCurrentWeek();
</script>
